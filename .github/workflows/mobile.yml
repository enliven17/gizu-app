name: Mobile
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  native-core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/modules/gizu-signer/core
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.94.1 --profile minimal --component rustfmt --component clippy
      - run: cargo fmt --check
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path ../../gizu-stored-signer/core/Cargo.toml
      - run: cargo fmt --check --manifest-path ../../gizu-stored-signer/core/Cargo.toml
      - run: cargo clippy --locked --all-targets --manifest-path ../../gizu-stored-signer/core/Cargo.toml -- -D warnings
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: extractions/setup-just@v3
        with:
          just-version: "1.40.0"
      - run: just mobile-install
      - run: just mobile-check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-${{ matrix.os }}
          path: mobile/coverage
  android-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: npm ci
        working-directory: mobile
      - run: rustup toolchain install 1.94.1 --profile minimal
      - run: rustup target add --toolchain 1.94.1 aarch64-linux-android
      - run: sdkmanager "ndk;27.1.12297006"
      - run: npm run format:kotlin:check
        working-directory: mobile
      - run: npm run stored-signer:build
        working-directory: mobile
      # Ephemeral CI-only key. Never add its fingerprint to the gizu.io association.
      - run: |
          mkdir -p .credentials
          keytool -genkeypair -noprompt -keystore .credentials/android-debug.keystore -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 1 -dname "CN=Gizu CI Only"
        working-directory: mobile
      - run: npx expo prebuild --platform android --no-install
        working-directory: mobile
      - run: ./gradlew :gizu-stored-signer:testDebugUnitTest assembleDebug --no-daemon -PreactNativeArchitectures=arm64-v8a
        working-directory: mobile/android
  ios-build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
        working-directory: mobile
      - run: npx expo prebuild --platform ios
        working-directory: mobile
      - run: xcodebuild -workspace ios/GizuDev.xcworkspace -scheme GizuDev -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO build
        working-directory: mobile
