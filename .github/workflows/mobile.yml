name: Mobile
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  native-core:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/modules/gizu-signer/core
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.94.1 --profile minimal --component rustfmt --component clippy
      - run: cargo fmt --check
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path ../../gizu-stored-signer/core/Cargo.toml
      - run: cargo fmt --check --manifest-path ../../gizu-stored-signer/core/Cargo.toml
      - run: cargo clippy --locked --all-targets --manifest-path ../../gizu-stored-signer/core/Cargo.toml -- -D warnings
  check:
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: extractions/setup-just@v3
        with:
          just-version: "1.40.0"
      - run: just mobile-install
      - name: Test native build preflight
        run: node --test scripts/tests/native-build.test.cjs
        working-directory: mobile
      - run: just mobile-check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-${{ matrix.os }}
          path: mobile/coverage
          retention-days: 7
          if-no-files-found: ignore
  android-build:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: npm ci
        working-directory: mobile
      - run: rustup toolchain install 1.94.1 --profile minimal
      - run: rustup target add --toolchain 1.94.1 aarch64-linux-android
      - run: sdkmanager "ndk;27.1.12297006"
      - run: npm run format:kotlin:check
        working-directory: mobile
      - run: npm run stored-signer:build
        working-directory: mobile
      # Ephemeral CI-only key. Never add its fingerprint to the gizu.io association.
      - run: |
          mkdir -p .credentials
          keytool -genkeypair -noprompt -keystore .credentials/android-debug.keystore -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 1 -dname "CN=Gizu CI Only"
        working-directory: mobile
      - run: npx expo prebuild --platform android --no-install
        working-directory: mobile
      - run: ./gradlew :gizu-stored-signer:testDebugUnitTest assembleDebug --no-daemon -PreactNativeArchitectures=arm64-v8a
        working-directory: mobile/android
      - name: Upload Android test reports
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: android-test-reports
          retention-days: 7
          if-no-files-found: ignore
          path: |
            mobile/modules/gizu-stored-signer/android/build/reports/tests/
            mobile/modules/gizu-stored-signer/android/build/test-results/
            mobile/android/build/reports/
  ios-build:
    timeout-minutes: 60
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
        working-directory: mobile
      - run: rustup toolchain install 1.94.1 --profile minimal
      - run: rustup target add --toolchain 1.94.1 aarch64-apple-ios aarch64-apple-ios-sim
      - run: npm run stored-signer:build:ios
        working-directory: mobile
      - run: npm run stored-signer:test:ios
        working-directory: mobile
        env:
          GIZU_IOS_TEST_RESULTS: ${{ runner.temp }}/gizu-native-debug.xcresult
      - run: npm run stored-signer:test:ios
        working-directory: mobile
        env:
          GIZU_IOS_TEST_CONFIGURATION: Release
          GIZU_IOS_TEST_RESULTS: ${{ runner.temp }}/gizu-native-release.xcresult
      - run: npx expo prebuild --platform ios
        working-directory: mobile
        env:
          EAS_BUILD_PROFILE: testflight
          EXPO_NO_DOTENV: "1"
      - run: npm run stored-signer:check:ios
        working-directory: mobile
      - run: xcodebuild -workspace ios/Gizu.xcworkspace -scheme Gizu -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO -resultBundlePath "${{ runner.temp }}/gizu-app-build.xcresult" build
        working-directory: mobile
        env:
          EAS_BUILD_PROFILE: testflight
          EXPO_NO_DOTENV: "1"
          EXPO_PUBLIC_API_URL: ""
      - name: Upload iOS build and test reports
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ios-native-reports
          retention-days: 7
          if-no-files-found: ignore
          path: ${{ runner.temp }}/gizu-*.xcresult
