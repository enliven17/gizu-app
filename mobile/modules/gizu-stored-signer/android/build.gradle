plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}
// Only an explicit local USB debug opt-in is accepted; no arbitrary endpoint property.
def earnBackendProperty = providers.gradleProperty('gizuEarnBackend').orNull
if (earnBackendProperty != null && earnBackendProperty != 'usb') {
  throw new GradleException("gizuEarnBackend accepts only 'usb'; omit it for the fixed hosted backend")
}
def debugEarnBackendMode = earnBackendProperty == 'usb' ? 'usb' : 'hosted'

group = 'io.gizu.storedwallet'
version = '0.1.0'
android {
  namespace 'io.gizu.storedwallet'
  buildFeatures { buildConfig true }
  buildTypes {
    debug { buildConfigField 'String', 'GIZU_EARN_BACKEND_MODE', '"' + debugEarnBackendMode + '"' }
    // Release never inherits the USB opt-in, even when the property is passed.
    release { buildConfigField 'String', 'GIZU_EARN_BACKEND_MODE', '"hosted"' }
  }
  defaultConfig { minSdk 24; versionCode 1; versionName "0.1.0" }
  sourceSets.main.java.srcDirs += '../generated'
  sourceSets.test.resources.srcDirs += '../ios/Tests/Fixtures'
}
dependencies {
  implementation 'com.squareup.okhttp3:okhttp:4.9.2'
  implementation 'androidx.credentials:credentials:1.6.0'
  implementation 'androidx.credentials:credentials-play-services-auth:1.6.0'
  implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
  implementation 'net.java.dev.jna:jna:5.17.0@aar'
  implementation 'com.upokecenter:cbor:4.5.6'
  testImplementation 'junit:junit:4.13.2'
  testImplementation 'org.json:json:20240303'
}
