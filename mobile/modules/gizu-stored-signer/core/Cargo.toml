[package]
name = "gizu-stored-signer-core"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["lib", "staticlib", "cdylib"]

[dependencies]
uniffi = "=0.32.2"
bip39 = { version = "=3.0.0", features = ["zeroize"] }
bip32 = { version = "=0.6.0", default-features = false, features = ["secp256k1", "alloc"] }
k256 = { version = "=0.14.0", default-features = false, features = ["ecdsa", "std"] }
alloy-consensus = { version = "=2.5.0", default-features = false, features = ["std"] }
alloy-primitives = { version = "=1.7.3", default-features = false, features = ["std"] }
zeroize = { version = "=1.9.0", features = ["derive"] }
thiserror = "2"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

[[bin]]
name = "uniffi-bindgen"
path = "src/bindgen.rs"
required-features = ["cli"]

[features]
cli = ["uniffi/cli"]
