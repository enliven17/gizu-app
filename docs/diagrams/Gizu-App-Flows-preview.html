weight="400" text-anchor="start" fill="#23354B">Private keys and raw signing authority stay on the device. Backend receives the signed payloads it relays and holds provider API credentials.</text><text x="58" y="1455.5" font-family="Arial,sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#23354B">PostgreSQL is not the wallet’s private-key store or operation journal. Chain/provider observations establish settlement; UI completion alone does not.</text><text x="44" y="1542.0" font-family="Arial,sans-serif" font-size="12" font-weight="700" text-anchor="start" fill="#23354B">CODE REFERENCES · source numbers are local to this page; component tooltips contain exact file paths</text><text x="44.0" y="1571.0" font-family="Arial,sans-serif" font-size="11" font-weight="400" text-anchor="start" fill="#23354B">S1 · storedAccess.ts:52</text><text x="648.0" y="1571.0" font-family="Arial,sans-serif" font-size="11" font-weight="400" text-anchor="start" fill="#23354B">S2 · DepositJourneyScreen.tsx:17</text><text x="1252.0" y="1571.0" font-family="Arial,sans-serif" font-size="11" font-weight="400" text-anchor="start" fill="#23354B">S3 · PasskeyGate.kt:68</text><text x="44.0" y="1595.0" font-family="Arial,sans-serif" font-size="11" font-weight="400" text-anchor="start" fill="#23354B">S4 · EarnDepositHost.kt:31</text><text x="648.0" y="1595.0" font-family="Arial,sans-serif" font-size="11" font-weight="400" text-anchor="start" fill="#23354B">S5 · lib.rs:226</text><text x="1252.0" y="1595.0" font-family="Arial,sans-serif" font-size="11" font-weight="400" text-anchor="start" fill="#23354B">S6 · engine.rs:491</text><text x="44.0" y="1619.0" font-family="Arial,sans-serif" font-size="11" font-weight="400" text-anchor="start" fill="#23354B">S7 · WalletStore.kt:340</text><text x="648.0" y="1619.0" font-family="Arial,sans-serif" font-size="11" font-weight="400" text-anchor="start" fill="#23354B">S8 · SwapEngine.kt:690</text><text x="1252.0" y="1619.0" font-family="Arial,san
