<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1460 390" role="img" aria-labelledby="title desc">
  <title id="title">Sell flow: stock token to Monad USDC</title>
  <desc id="desc">The app quotes a sale, each holding wallet signs a permit and 1inch Fusion order, USDG is deposited into Aurora, converted to a confidential USDC balance, and paid out to three fresh Monad wallets.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L10 5 L0 10 z" fill="#7C91AE" />
    </marker>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    </style>
  </defs>
  <rect x="1" y="1" width="1458" height="388" rx="22" fill="#101827" stroke="#28364B" stroke-width="2" />
  <text x="34" y="48" fill="#F3F6FC" font-size="25" font-weight="700">SELL</text>
  <text x="105" y="48" fill="#A9B8CC" font-size="19">stock token → Monad USDC</text>
  <text x="34" y="78" fill="#8495AD" font-size="14">Fusion sells each holding; Aurora privately converts and returns the proceeds.</text>

  <g fill="none" stroke="#7C91AE" stroke-width="2.5" marker-end="url(#arrow)">
    <path d="M207 198 H230" /><path d="M410 198 H433" /><path d="M613 198 H636" />
    <path d="M816 198 H839" /><path d="M1019 198 H1042" /><path d="M1222 198 H1245" />
  </g>

  <g>
    <rect x="28" y="112" width="179" height="172" rx="15" fill="#28341F" stroke="#A6CE65" stroke-width="2" />
    <circle cx="52" cy="137" r="13" fill="#A6CE65" /><text x="52" y="142" text-anchor="middle" fill="#101827" font-size="13" font-weight="800">1</text>
    <text x="45" y="176" fill="#F3F6FC" font-size="16" font-weight="700">Stock holdings</text>
    <text x="45" y="204" fill="#D2E6B2" font-size="13"><tspan x="45">Token sits in up to</tspan><tspan x="45" dy="19">three holder wallets</tspan></text>

    <rect x="231" y="112" width="179" height="172" rx="15" fill="#1B2940" stroke="#8D74F6" stroke-width="2" />
    <circle cx="255" cy="137" r="13" fill="#8D74F6" /><text x="255" y="142" text-anchor="middle" fill="#101827" font-size="13" font-weight="800">2</text>
    <text x="248" y="176" fill="#F3F6FC" font-size="16" font-weight="700">Quote &amp; review</text>
    <text x="248" y="204" fill="#B7C4D7" font-size="13"><tspan x="248">App previews sale and</tspan><tspan x="248" dy="19">Aurora deposit per leg</tspan></text>

    <rect x="434" y="112" width="179" height="172" rx="15" fill="#1B2940" stroke="#F1B84B" stroke-width="2" />
    <circle cx="458" cy="137" r="13" fill="#F1B84B" /><text x="458" y="142" text-anchor="middle" fill="#101827" font-size="13" font-weight="800">3</text>
    <text x="451" y="176" fill="#F3F6FC" font-size="16" font-weight="700">1inch Fusion</text>
    <text x="451" y="204" fill="#B7C4D7" font-size="13"><tspan x="451">Each wallet signs a</tspan><tspan x="451" dy="19">permit and sell order</tspan></text>

    <rect x="637" y="112" width="179" height="172" rx="15" fill="#1B2940" stroke="#4B9BFF" stroke-width="2" />
    <circle cx="661" cy="137" r="13" fill="#4B9BFF" /><text x="661" y="142" text-anchor="middle" fill="#101827" font-size="13" font-weight="800">4</text>
    <text x="654" y="176" fill="#F3F6FC" font-size="16" font-weight="700">USDG proceeds</text>
    <text x="654" y="204" fill="#B7C4D7" font-size="13"><tspan x="654">Fusion sends USDG to</tspan><tspan x="654" dy="19">Aurora quote addresses</tspan></text>

    <rect x="840" y="112" width="179" height="172" rx="15" fill="#123B3B" stroke="#33C6B2" stroke-width="2" />
    <circle cx="864" cy="137" r="13" fill="#33C6B2" /><text x="864" y="142" text-anchor="middle" fill="#101827" font-size="13" font-weight="800">5</text>
    <text x="857" y="176" fill="#F3F6FC" font-size="16" font-weight="700">Private balance C</text>
    <text x="857" y="204" fill="#C0E8E2" font-size="13"><tspan x="857">Aurora credits private</tspan><tspan x="857" dy="19">USDC after conversion</tspan></text>

    <rect x="1043" y="112" width="179" height="172" rx="15" fill="#1B2940" stroke="#33C6B2" stroke-width="2" />
    <circle cx="1067" cy="137" r="13" fill="#33C6B2" /><text x="1067" y="142" text-anchor="middle" fill="#101827" font-size="13" font-weight="800">6</text>
    <text x="1060" y="176" fill="#F3F6FC" font-size="16" font-weight="700">3 Aurora payouts</text>
    <text x="1060" y="204" fill="#B7C4D7" font-size="13"><tspan x="1060">C pays USDC to</tspan><tspan x="1060" dy="19">fresh Monad addresses</tspan></text>

    <rect x="1246" y="112" width="179" height="172" rx="15" fill="#1B2940" stroke="#4B9BFF" stroke-width="2" />
    <circle cx="1270" cy="137" r="13" fill="#4B9BFF" /><text x="1270" y="142" text-anchor="middle" fill="#101827" font-size="13" font-weight="800">7</text>
    <text x="1263" y="176" fill="#F3F6FC" font-size="16" font-weight="700">Monad USDC</text>
    <text x="1263" y="204" fill="#B7C4D7" font-size="13"><tspan x="1263">Returned to three</tspan><tspan x="1263" dy="19">new wallets</tspan></text>
  </g>

  <rect x="28" y="316" width="1397" height="44" rx="12" fill="#172336" />
  <circle cx="51" cy="338" r="6" fill="#4B9BFF" />
  <text x="68" y="343" fill="#B7C4D7" font-size="14"><tspan fill="#E7EDF7" font-weight="700">Public:</tspan> Fusion fills, Aurora deposit, and Monad payouts. <tspan fill="#E7EDF7" font-weight="700">Private:</tspan> the internal balance and transfers through C.</text>
</svg>
